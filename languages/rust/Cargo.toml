[package]
name = "msl-network"
version = "0.1.0"
edition = "2024"

[dependencies]
bitflags = "2.13.2"
bytes = "1.12.1"
compcol = { version = "0.7.2", features = ["bzip2", "xz", "zlib", "zstd"], default-features = false }
hex = "0.4.3"
log = "0.4.34"
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
serde-pickle = "1.2.0"
serde_json = "1.0.151"
zeromq = { version = "0.6.0", features = ["tokio-runtime"] }

[dev-dependencies]
clang_log = "2.1.2"
serde_bytes = "0.11.19"
tokio = "1.53.1"
